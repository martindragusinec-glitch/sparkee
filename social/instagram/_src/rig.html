<!doctype html>
<!-- Zmrazí živý rig maskota (assets/js/mascot.js) v čase a vrátí statické SVG.
     Používá build.mjs: freeze('tap', 1.4) → SVG string → _src/rig/tap-1.4.svg
     Zdroj postavičky = inline SVG z index.html (MASCOT:START/END), jen transformace a d rukou z rigu, nic se nepřekresluje. -->
<html lang="cs"><head><meta charset="utf-8"><title>Sparkee rig freeze</title>
<link rel="stylesheet" href="/assets/css/mascot.css">
</head>
<body style="margin:0">
<div id="stage" style="width:600px;height:900px"></div>
<script src="/assets/js/mascot-rig.js"></script>
<script src="/assets/js/mascot.js"></script>
<script>
let SRC = null;
window.freeze = async (action, t) => {
  if (!SRC) {
    const html = await (await fetch('/index.html')).text();
    SRC = html.split('<!-- MASCOT:START -->')[1].split('<!-- MASCOT:END -->')[0];
  }
  const stage = document.getElementById('stage');
  stage.innerHTML = SRC;
  const svg = stage.querySelector('svg');
  const m = SparkeeMascot.create(svg, { lab: true, seed: 1 });
  m.set(action, t);
  m.pause && m.pause();
  // plátno SVG rozšířit na skutečný obrys (ruce/srdíčko můžou přesahovat původní viewBox), kresba beze změny
  const [vx, vy, vw, vh] = svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
  const bb = svg.getBBox(), pad = 6;
  const x0 = Math.min(vx, bb.x - pad), y0 = Math.min(vy, bb.y - pad);
  const x1 = Math.max(vx + vw, bb.x + bb.width + pad), y1 = Math.max(vy + vh, bb.y + bb.height + pad);
  const out = svg.cloneNode(true);
  out.setAttribute('viewBox', [x0, y0, x1 - x0, y1 - y0].map(v => +v.toFixed(2)).join(' '));
  out.removeAttribute('class');
  out.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  out.setAttribute('aria-label', `Sparkee maskot (rig ${action} ${t} s)`);
  out.removeAttribute('style');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(out);
};
</script>
</body></html>

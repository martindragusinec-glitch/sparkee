<!doctype html>
<!-- Sparkee ✦ Instagram: náhledy pro klienta (_preview/). Renderuje build.mjs po vyexportování PNG.
     profile-grid(-pinned): mockup profilu na telefonu · avatar-test: profilovka ve 32 až 110 px, světlý a tmavý režim ·
     stories-guide: stories se safe zónami a nákresem nativních stickerů · feed-overview: všechny slidy po postech -->
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Sparkee IG náhledy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F5F4FB}
body{font-family:"Nunito",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#2C303C}
img{display:block}
.view{display:inline-block;position:relative}
.bh{font:800 40px/1 "Baloo 2",sans-serif;letter-spacing:-.01em}
.muted{color:#6A6F7D}
.spk{display:inline-block;width:.62em;height:.62em;vertical-align:.02em}

/* ---------- mockup profilu (navrženo v 390 pt, zoom 3 = 1170 px obrazovka) ---------- */
.stagep{zoom:3;padding:28px 34px 34px;background:radial-gradient(420px 300px at 0% 0%,rgba(165,237,197,.45),transparent 70%),radial-gradient(420px 320px at 100% 100%,rgba(196,156,242,.35),transparent 70%),#F5F4FB}
.stagep .cap{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 14px}
.stagep .cap b{font:800 17px/1 "Baloo 2",sans-serif;letter-spacing:-.01em}
.stagep .cap span{font:700 9px/1.2 "Nunito",sans-serif;color:#6A6F7D;text-align:right}
.device{width:410px;padding:10px;border-radius:52px;background:#1B1D24;box-shadow:0 30px 60px -20px rgba(44,48,60,.45),0 0 0 1.5px #3A3E4B inset}
.ig{width:390px;border-radius:42px;overflow:hidden;background:#fff;color:#000;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.3}
.ig.dark{background:#000;color:#F5F5F5}
.sb{height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font-weight:600;font-size:16px}
.sb .isl{width:120px;height:34px;border-radius:20px;background:#000;margin-top:-4px}
.sb svg{height:12px}
.nav{height:44px;display:flex;align-items:center;gap:14px;padding:0 14px}
.nav .h{flex:1;font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.prof{display:flex;align-items:center;gap:22px;padding:6px 16px 10px}
.ring{width:92px;height:92px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75);flex:none}
.ring i{display:block;width:100%;height:100%;border-radius:50%;padding:3px;background:#fff}
.ig.dark .ring i{background:#000}
.ring img{width:100%;height:100%;border-radius:50%}
.stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:17px;font-weight:700}
.stats span{font-size:13px}
.bio{padding:0 16px}
.bio .n{font-weight:600}
.bio .cat{color:#737373}
.bio .ln{color:#00376B;font-weight:600;display:flex;align-items:center;gap:5px;margin-top:2px}
.ig.dark .bio .ln{color:#E0F1FF}
.bio .ln svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.btns{display:flex;gap:6px;padding:12px 16px 4px}
.btns span{flex:1;height:32px;border-radius:8px;background:#EFEFEF;display:grid;place-items:center;font-weight:600;font-size:14px}
.ig.dark .btns span{background:#262626}
.btns span.f{background:#0095F6;color:#fff}
.btns span.sm{flex:none;width:34px}
.btns svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hls{display:flex;gap:14px;padding:14px 16px 8px;overflow:hidden;white-space:nowrap}
.hl{flex:none;width:68px;text-align:center;font-size:12px}
.hl i{display:block;width:68px;height:68px;border-radius:50%;padding:3px;border:1px solid #DBDBDB;margin-bottom:5px;background:#fff}
.ig.dark .hl i{border-color:#363636;background:#000}
.hl img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 50%}
.tabs{display:flex;border-top:1px solid #DBDBDB;margin-top:8px}
.ig.dark .tabs{border-color:#262626}
.tabs span{flex:1;height:44px;display:grid;place-items:center;color:#8E8E8E;position:relative}
.tabs span.on{color:inherit}
.tabs span.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:1.5px;background:currentColor}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;background:#ddd}
.tile img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.tile svg{position:absolute;right:7px;top:7px;width:18px;height:18px;filter:drop-shadow(0 0 2px rgba(0,0,0,.45))}
.tile svg *{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile svg .fl{fill:#fff;stroke:none}
.tile .no{position:absolute;left:5px;bottom:5px;font:800 8px/1 "Nunito",sans-serif;color:#fff;background:rgba(0,0,0,.4);padding:2px 5px 1px;border-radius:7px}
.homebar{height:34px;display:grid;place-items:center}
.homebar i{width:134px;height:5px;border-radius:5px;background:#000}
.ig.dark .homebar i{background:#fff}

/* ---------- avatar test (1:1 px) ---------- */
.av{padding:56px 64px 64px;display:grid;gap:34px;width:1640px}
.av .row{display:flex;gap:40px;align-items:stretch}
.av .pane{flex:1;border-radius:28px;padding:30px 34px;display:flex;flex-direction:column;gap:20px}
.av .pane.l{background:#fff;border:1px solid #E6E3EF;color:#000}
.av .pane.d{background:#000;color:#F5F5F5}
.av .pane h3{font:800 26px/1 "Nunito",sans-serif}
.av .sizes{display:flex;align-items:flex-end;gap:34px}
.av .sizes figure{display:flex;flex-direction:column;align-items:center;gap:10px;font:700 15px/1 "Nunito",sans-serif;opacity:.95}
.av .sizes img{border-radius:50%}
.av .sring{padding:3px;border-radius:50%;background:conic-gradient(from 200deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75)}
.av .sring i{display:block;padding:2px;border-radius:50%;background:#fff}
.av .pane.d .sring i{background:#000}
.av .cmt{display:flex;gap:12px;align-items:flex-start;font:15px/1.35 -apple-system,"Helvetica Neue",Arial,sans-serif;max-width:560px}
.av .cmt b{font-weight:600}
.av .big{display:flex;gap:34px;align-items:center}
.av .big{flex-wrap:wrap}
.av .big img{width:218px;height:218px;border-radius:50%}
.av .big .sq{border-radius:24px}

/* ---------- stories guide (1/3) ---------- */
.sg{padding:56px 60px 64px;width:2460px}
.sg .list{display:flex;gap:30px;margin-top:34px}
.sg .st{width:360px}
.sg .fr{position:relative;width:360px;height:640px;border-radius:26px;overflow:hidden;box-shadow:0 20px 40px -18px rgba(44,48,60,.5)}
.sg .fr>img{width:100%;height:100%}
.sg .ov{position:absolute;left:0;top:0;width:1080px;height:1920px;zoom:.33333}
.sg .unsafe{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(255,79,154,.30) 0 16px,rgba(255,79,154,.12) 16px 32px)}
.sg .side{position:absolute;top:250px;bottom:340px;width:64px;background:rgba(255,79,154,.14)}
.sg .ui-top{position:absolute;left:36px;right:36px;top:30px;display:flex;flex-direction:column;gap:22px}
.sg .ui-top .bars{display:flex;gap:8px}.sg .ui-top .bars i{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.55)}
.sg .ui-top .who{display:flex;align-items:center;gap:18px;font:700 36px/1 -apple-system,Arial,sans-serif;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.sg .ui-top .who img{width:72px;height:72px;border-radius:50%}
.sg .ui-bot{position:absolute;left:36px;right:36px;bottom:44px;display:flex;gap:26px;align-items:center}
.sg .ui-bot i{flex:1;height:110px;border-radius:60px;border:3px solid rgba(255,255,255,.8);color:#fff;font:600 36px/110px -apple-system,Arial,sans-serif;padding-left:44px;font-style:normal;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.sg .zone{position:absolute;z-index:2;border:5px dashed #ff4f9a;border-radius:28px;background:rgba(255,79,154,.07)}
.sg h4{font:800 30px/1 "Baloo 2",sans-serif;margin:46px 0 0}
.sg .list{flex-wrap:wrap}
.sg .stk{position:absolute;z-index:3;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#000;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.sg .stk.q{background:#fff;border-radius:44px;overflow:hidden;text-align:center}
.sg .stk.q .top{background:linear-gradient(120deg,#A5EDC5,#9AD8F8 40%,#C49CF2);padding:70px 40px 40px;font:700 52px/1.15 -apple-system,Arial,sans-serif;position:relative}
.sg .stk.q .top img{position:absolute;left:50%;top:-6px;translate:-50% -50%;width:88px;height:88px;border-radius:50%;border:6px solid #fff}
.sg .stk.q .in{margin:34px 40px 40px;padding:26px;border-radius:24px;background:#EFEFEF;color:#8E8E8E;font-size:40px}
.sg .stk.poll{background:#fff;border-radius:44px;padding:44px 44px 34px}
.sg .stk.poll .t{font:700 50px/1.1 -apple-system,Arial,sans-serif;text-align:center;margin-bottom:30px}
.sg .stk.poll .o{height:84px;border-radius:44px;background:#F1F1F1;margin-bottom:18px;display:flex;align-items:center;padding:0 34px;font:600 40px/1 -apple-system,Arial,sans-serif}
.sg .stk.poll .o b{width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid #DDD;display:grid;place-items:center;margin-right:24px;font-size:28px;color:#8E8E8E}
.sg .stk.link{background:#fff;border-radius:34px;display:flex;align-items:center;justify-content:center;gap:18px;font:700 48px/1 -apple-system,Arial,sans-serif;color:#7456DC;text-transform:uppercase}
.sg .stk.link svg{width:52px;height:52px;fill:none;stroke:#7456DC;stroke-width:2.4;stroke-linecap:round}
.sg .stk.share{border-radius:30px;overflow:hidden;background:#fff;padding:18px 18px 0}
.sg .stk.share img{width:100%;border-radius:18px}
.sg .stk.share .by{display:flex;align-items:center;gap:14px;font:700 30px/1 -apple-system,Arial,sans-serif;padding:14px 4px 22px}
.sg .stk.share .by img{width:44px;height:44px;border-radius:50%}
.sg .meta{margin-top:18px;font:800 22px/1.25 "Nunito",sans-serif}
.sg .meta span{display:block;font-weight:700;font-size:19px;color:#6A6F7D;margin-top:6px}
.sg .legend{display:flex;gap:26px;align-items:center;font:700 20px/1 "Nunito",sans-serif;color:#4A4E5B;margin-top:14px}
.sg .legend i{display:inline-block;width:26px;height:18px;border-radius:5px;margin-right:8px;vertical-align:-3px}

/* ---------- feed overview ---------- */
.fo{padding:56px 60px 64px;width:2360px}
.fo .post{display:grid;grid-template-columns:250px 1fr;gap:26px;align-items:start;padding:26px 0;border-top:2px solid #E3E0EC}
.fo .post:first-of-type{border-top:0}
.fo .lab b{display:block;font:800 30px/1 "Baloo 2",sans-serif}
.fo .lab span{display:block;font:700 18px/1.3 "Nunito",sans-serif;color:#6A6F7D;margin-top:8px}
.fo .th{display:flex;gap:12px;flex-wrap:wrap}
.fo .th img{width:222px;border-radius:14px;box-shadow:0 10px 24px -14px rgba(44,48,60,.6)}
.fo .th img.reel{width:176px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { POSTS, STORIES, PROFILE } from './content.mjs';
const IG = '/social/instagram/';
const SPARK_D = 'M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12C7 11 11 7 12 0z';
const spk = (fill = 'url(#pg)') => `<svg class="spk" viewBox="0 0 24 24"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#139770"/><stop offset=".5" stop-color="#6E4FD8"/><stop offset="1" stop-color="#C9468C"/></linearGradient></defs><path d="${SPARK_D}" fill="${fill}"/></svg>`;
const byN = n => POSTS.find(p => p.n === n);
const first = p => `${IG}feed/${p.dir}/${p.slides[0].file || '01.png'}`;
const AVATAR = `${IG}avatar/sparkee-avatar-dark.png`;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const plain = s => s.replace(/<[^>]+>/g, '').replace(/\n/g, ' ');

const I = {
  back: '<path d="M15 5l-7 7 7 7"/>', bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  grid: '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/>',
  reels: '<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M3.5 8.5h17M9 3.5l2.5 5M14.5 3.5l2.5 5"/><path d="M10.5 12v5l4-2.5z"/>',
  tag: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19c1-3 3-4.4 5.5-4.4s4.5 1.4 5.5 4.4"/>',
  multi: '<rect x="8" y="3" width="13" height="13" rx="2" class="fl"/><path d="M5 8v11a2 2 0 0 0 2 2h11"/>',
  reel: '<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M10.5 9.5v5l4-2.5z" class="fl"/>',
  pin: '<path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z" class="fl"/><path d="M12 14v7"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  addp: '<circle cx="10" cy="8" r="3.5"/><path d="M3.5 19c.8-3.5 3.3-5.3 6.5-5.3s5.7 1.8 6.5 5.3M18.5 8v6M15.5 11h6"/>',
};
const svg = (k, cls = '') => `<svg viewBox="0 0 24 24" class="${cls}">${I[k]}</svg>`;

function profile({ order, pinned = [], mode = 'light', title, note }) {
  const tiles = order.map(n => {
    const p = byN(n);
    const ic = pinned.includes(n) ? 'pin' : p.kind === 'reel' ? 'reel' : p.kind === 'carousel' ? 'multi' : '';
    return `<div class="tile"><img src="${first(p)}" alt="">${ic ? svg(ic) : ''}<span class="no">P${n}</span></div>`;
  }).join('');
  return `<div class="stagep">
    <div class="cap"><b>${title}</b><span>${note}</span></div>
    <div class="device"><div class="ig ${mode}">
      <div class="sb"><span>9:41</span><i class="isl"></i><svg viewBox="0 0 70 12"><rect x="0" y="7" width="3" height="5" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/><rect x="40" y="0.5" width="24" height="11" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="42" y="2.5" width="18" height="7" rx="1.5" fill="currentColor"/></svg></div>
      <div class="nav">${svg('back')}<span class="h">${PROFILE.handle}</span>${svg('bell')}${svg('more')}</div>
      <div class="prof"><span class="ring"><i><img src="${AVATAR}" alt=""></i></span>
        <div class="stats"><div><b>9</b><span>příspěvků</span></div><div><b>0</b><span>sledujících</span></div><div><b>42</b><span>sledovaných</span></div></div></div>
      <div class="bio"><div class="n">${PROFILE.name}</div><div class="cat">${PROFILE.category}</div>
        ${PROFILE.bio.map(l => `<div>${esc(l)}</div>`).join('')}
        <div class="ln">${svg('link')}${PROFILE.linkTitle} <span style="font-weight:400;opacity:.75">a další 2</span></div></div>
      <div class="btns"><span class="f">Sledovat</span><span>Zpráva</span><span>E-mail</span><span class="sm">${svg('addp')}</span></div>
      <div class="hls">${PROFILE.highlights.map(h => `<div class="hl"><i><img src="${IG}highlights/${h.id}.png" alt="" style="object-fit:cover;object-position:50% 50%;aspect-ratio:1"></i>${h.label}</div>`).join('')}</div>
      <div class="tabs"><span class="on">${svg('grid')}</span><span>${svg('reels')}</span><span>${svg('tag')}</span></div>
      <div class="grid">${tiles}</div>
      <div class="homebar"><i></i></div>
    </div></div></div>`;
}

function avatarTest() {
  const vars = [['sparkee-avatar-dark.png', 'Varianta A: hlava na tmavé se září (doporučená)'], ['sparkee-avatar-light.png', 'Varianta B: hlava na světlé holo'], ['sparkee-avatar-s.png', 'Varianta C: kruh s „s“ z Figmy (písmeno z wordmarku)']];
  const pane = (file, mode) => `<div class="pane ${mode === 'dark' ? 'd' : 'l'}"><h3>${mode === 'dark' ? 'Tmavý režim IG' : 'Světlý režim IG'}</h3>
    <div class="sizes">
      ${[32, 40, 56].map(s => `<figure><img src="${IG}avatar/${file}" style="width:${s}px;height:${s}px">${s} px</figure>`).join('')}
      <figure><span class="sring"><i><img src="${IG}avatar/${file}" style="width:72px;height:72px"></i></span>72 px + stories</figure>
      <figure><img src="${IG}avatar/${file}" style="width:110px;height:110px">110 px</figure>
      <figure><span class="sring"><i><img src="${IG}avatar/${file}" style="width:150px;height:150px"></i></span>profil</figure>
    </div>
    <div class="cmt"><img src="${IG}avatar/${file}" style="width:32px;height:32px;border-radius:50%;flex:none"><div><b>${PROFILE.handle}</b> Díky! Pošli mi odkaz na profil a mrknu na to ✦<div style="opacity:.55;font-size:13px;margin-top:4px">2 min · To se mi líbí · Odpovědět</div></div></div></div>`;
  return `<div class="av">
    <div><div class="bh">Profilovka ${spk()} test čitelnosti</div><div class="muted" style="font:700 20px/1.3 Nunito;margin-top:10px">Skutečné velikosti v pixelech (1:1). IG ořízne čtverec 1080×1080 do kruhu. Hlava z assets/img/poses/head.svg, „s“ z assets/img/logo.svg, obojí beze změny tvaru.</div></div>
    ${vars.map(([f, t]) => `<div><div style="font:800 24px/1 Nunito;margin-bottom:16px">${t}</div><div class="row">${pane(f, 'light')}${pane(f, 'dark')}</div></div>`).join('')}
    <div class="big">${vars.map(([f]) => `<img class="sq" src="${IG}avatar/${f}"><img src="${IG}avatar/${f}">`).join('')}</div>
  </div>`;
}

function stickerMock(s) {
  const k = s.sticker, st = `left:${k.x}px;top:${k.y}px;width:${k.w}px;${k.kind === 'share' || k.kind === 'poll' || k.kind === 'question' ? '' : `height:${k.h}px;`}`;
  if (k.kind === 'question') return `<div class="stk q" style="${st}"><div class="top"><img src="${AVATAR}">${esc(k.text)}</div><div class="in">Napiš něco…</div></div>`;
  if (k.kind === 'poll' || k.kind === 'quiz') return `<div class="stk poll" style="${st}"><div class="t">${esc(k.text)}</div>${k.options.map((o, i) => `<div class="o"><b>${k.kind === 'quiz' ? 'ABC'[i] : ''}</b>${esc(o)}</div>`).join('')}</div>`;
  if (k.kind === 'link') return `<div class="stk link" style="${st}"><svg viewBox="0 0 24 24">${I.link}</svg>${esc(k.text)}</div>`;
  if (k.kind === 'share') return `<div class="stk share" style="${st}"><img src="${IG}${s.share}"><div class="by"><img src="${AVATAR}">${PROFILE.handle}</div></div>`;
  return '';
}
function storiesGuide() {
  const lab = { question: 'otázka', poll: 'anketa', quiz: 'kvíz', link: 'odkaz', share: 'sdílený Reel' };
  const frame = s => `<div class="st">
      <div class="fr"><img src="${IG}${s.set === 'highlight' ? 'highlights/stories' : 'stories'}/${s.file}"><div class="ov">
        <div class="unsafe" style="top:0;height:250px"></div><div class="unsafe" style="bottom:0;height:340px"></div>
        <div class="side" style="left:0"></div><div class="side" style="right:0"></div>
        <div class="ui-top"><div class="bars"><i></i><i></i><i></i></div><div class="who"><img src="${AVATAR}">${PROFILE.handle} <span style="opacity:.7;font-weight:500">2 h</span></div></div>
        ${s.sticker ? `<div class="zone" style="left:${s.sticker.x}px;top:${s.sticker.y}px;width:${s.sticker.w}px;height:${s.sticker.h}px"></div>${stickerMock(s)}` : ''}
        <div class="ui-bot"><i>Odeslat zprávu</i></div>
      </div></div>
      <div class="meta">${s.file.replace('.png', '')}${s.sticker ? ` · ${lab[s.sticker.kind]}` : ''}<span>${s.when || 'Den −2 (ne 4. 10.)'}${s.hl ? ` · highlight ${s.hl}` : ''}</span></div>
    </div>`;
  const launch = STORIES.filter(s => s.set !== 'highlight'), hs = STORIES.filter(s => s.set === 'highlight');
  return `<div class="sg"><div class="bh">Stories ${spk()} safe zóny a nativní stickery</div>
    <div class="muted" style="font:700 20px/1.3 Nunito;margin-top:10px">Pod nákresem je čistý export (v ploše pro sticker je jen měkká záře bez rámečku). Přes něj rozhraní IG, obrys plochy a nákres stickeru, který se přidá v aplikaci. Text drží v y 250 až 1580 a x 64 až 1016.</div>
    <div class="legend"><span><i style="background:repeating-linear-gradient(135deg,rgba(255,79,154,.45) 0 6px,rgba(255,79,154,.2) 6px 12px)"></i>mimo safe zónu (lišta profilu, pole odpovědi)</span><span><i style="border:3px dashed #ff4f9a"></i>plocha pro sticker (jen v tomto náhledu)</span><span><i style="background:#fff;border:2px solid #ccc"></i>nativní sticker (nákres)</span></div>
    <h4>Launch stories (stories/)</h4>
    <div class="list">${launch.map(frame).join('')}</div>
    <h4>Stálý obsah highlightů, nahrát Den −2 (highlights/stories/)</h4>
    <div class="list">${hs.map(frame).join('')}</div></div>`;
}

function feedOverview() {
  return `<div class="fo"><div class="bh" style="margin-bottom:20px">Feed ${spk()} všech 9 příspěvků po slidech</div>
    ${POSTS.map(p => `<div class="post"><div class="lab"><b>P${p.n}</b><span>${p.kind === 'reel' ? 'Reel (cover 1080×1920)' : p.kind === 'carousel' ? `carousel · ${p.slides.length} slidů` : 'jeden obrázek'}<br>${p.tone === 'dark' ? 'tma' : 'světlo · ' + ({ mint: 'mint', sky: 'sky', lilac: 'lilac', blush: 'blush' }[p.accent])}<br>${p.dir}</span></div>
      <div class="th">${p.slides.map((s, i) => `<img class="${p.kind === 'reel' ? 'reel' : ''}" src="${IG}feed/${p.dir}/${s.file || String(i + 1).padStart(2, '0') + '.png'}">`).join('')}</div></div>`).join('')}
  </div>`;
}

const VIEWS = {
  'profile-grid': () => profile({ order: [9, 8, 7, 6, 5, 4, 3, 2, 1], title: 'Profil po P9', note: 'nejnovější vlevo nahoře · náhledy 3:4<br>launch 6. až 22. 10.' }),
  'profile-grid-pinned': () => profile({ order: [1, 2, 9, 8, 7, 6, 5, 4, 3], pinned: [1, 2, 9], title: 'Po připnutí P1, P2, P9', note: 'horní řada: kdo jsem · co umím · ozvi se' }),
  'profile-grid-dark': () => profile({ order: [9, 8, 7, 6, 5, 4, 3, 2, 1], mode: 'dark', title: 'Tmavý režim IG', note: 'stejný grid po P9' }),
  'avatar-test': avatarTest,
  'stories-guide': storiesGuide,
  'feed-overview': feedOverview,
};

async function settle(el) {
  await Promise.all([...el.querySelectorAll('img')].map(i => i.decode().catch(() => { throw new Error('obrázek se nenačetl: ' + i.src); })));
  await document.fonts.ready;
}
window.PREVIEW = {
  ready: true,
  views: () => Object.keys(VIEWS).map(id => ({ id, w: 2600, h: 4000 })),
  async render(id) {
    const root = document.getElementById('root');
    root.innerHTML = `<div class="view">${VIEWS[id]()}</div>`;
    await settle(root);
    const r = root.firstElementChild.getBoundingClientRect();
    return { w: Math.ceil(r.width), h: Math.ceil(r.height) };
  },
};
const q = new URLSearchParams(location.search);
if (q.has('v')) PREVIEW.render(q.get('v'));
</script>
</body>
</html>
